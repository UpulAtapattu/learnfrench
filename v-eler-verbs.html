<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <title>French Conjugation Trainer</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        system-ui,
        -apple-system,
        sans-serif;
      background: radial-gradient(circle at top, #1c1c1c, #0f0f0f);
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 50px;
    }

    .app {
      width: 100%;
      max-width: 650px; /* Slightly wider for longer sentences */
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    /* Header Section */
    .header-section {
      text-align: center;
      margin-bottom: 20px;
      width: 100%;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #fff;
      margin: 0 0 5px 0;
    }

    .subtitle {
      font-size: 1rem;
      color: #4da3ff;
      margin: 0 0 15px 0;
      font-weight: 500;
    }

    .guidance-box {
      background: rgba(255, 255, 255, 0.08);
      border-left: 4px solid #4da3ff;
      padding: 12px 16px;
      border-radius: 6px;
      text-align: left;
      margin: 0 auto;
      max-width: 95%;
    }

    .guidance-box p {
      margin: 0;
      font-size: 0.95rem;
      line-height: 1.5;
      color: #ddd;
    }

    .guidance-box strong {
      color: #fff;
      font-weight: 600;
    }

    /* Word & Input */
    h2 {
      font-size: 3rem;
      margin: 10px 0;
      letter-spacing: 1px;
      color: #4da3ff;
    }

    input {
      width: 100%;
      font-size: 1.8rem;
      padding: 12px 14px;
      border-radius: 10px;
      border: none;
      outline: none;
      text-align: center;
      background: #222;
      color: #fff;
      border: 2px solid transparent;
      transition: all 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #4da3ff;
      background: #1e1e1e;
    }

    input.correct {
      border-color: #4ade80;
      background: #1a3320;
      color: #4ade80;
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition:
        transform 0.15s ease,
        opacity 0.15s ease;
    }

    button:active {
      transform: scale(0.98);
      opacity: 0.9;
    }

    #meaningBtn {
      background: #333;
      color: #ccc;
      margin-bottom: 10px;
    }

    #meaningBtn:hover {
      background: #444;
    }

    #nextBtn {
      background: linear-gradient(135deg, #4ade80, #22c55e);
      color: #003311;
      display: none;
      margin-top: 20px;
    }

    #meaning {
      min-height: 1.5em;
      font-size: 1.1rem;
      opacity: 0.85;
      text-align: center;
      font-style: italic;
    }

    /* Table Styles */
    .table-container {
      width: 100%;
      margin-top: 20px;
      display: none;
      animation: fadeIn 0.5s ease;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #222;
      border-radius: 10px;
      overflow: hidden;
      font-size: 0.95rem;
    }

    th,
    td {
      padding: 12px 15px;
      text-align: left;
      border-bottom: 1px solid #333;
    }

    th {
      background: #2a2a2a;
      color: #aaa;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.8rem;
    }

    /* The "Pointer" Effect */
    tr.active-row {
      background-color: #4da3ff33;
      border-left: 4px solid #4da3ff;
    }

    tr.active-row td {
      color: #fff;
    }

    .translation {
      color: #888;
      font-size: 0.85rem;
      display: block;
      margin-top: 4px;
    }

    /* Highlight class for 'll' */
    .accent-change {
      color: #ffeb3b;
      /* Bright Yellow */
      font-weight: bold;
      text-shadow: 0 0 5px rgba(255, 235, 59, 0.5);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 400px) {
      h2 { font-size: 2.2rem; }
      td, th { padding: 8px 10px; }
    }
  </style>
</head>

<body>
  <div class="app">
    
    <header class="header-section">
      <h1>Verbs Ending in -eler</h1>
      <p class="subtitle">(l → ll)</p>

      <div class="guidance-box">
        <p>
          <strong>The "Double L" Rule:</strong> For these verbs, the letter <strong>l</strong> doubles to <strong>ll</strong> before a silent ending (<em>Je, Tu, Il, Ils</em>). 
          The stem remains a single <strong>l</strong> for <strong>Nous</strong> and <strong>Vous</strong>.
        </p>
      </div>
    </header>

    <h2 id="word"></h2>
    <div id="meaning"></div>

    <input id="input" autocomplete="off" autofocus inputmode="text" spellcheck="false" placeholder="Type the verb..." />

    <button id="meaningBtn">Show Pronunciation</button>

    <div id="conjugation-container" class="table-container">
      <table id="conjugation-table">
        <thead>
          <tr>
            <th>Pronoun</th>
            <th>Sentence</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>

    <button id="nextBtn">Next Verb ➔</button>
  </div>

  <script>
    // 1. DATA: Verbs + Sentences (-eler)
    const verbs = [
      { fr: "appeler", en: "to call", pron: "ah-puh-lay" },
      { fr: "épeler", en: "to spell", pron: "ay-puh-lay" },
      { fr: "ensorceler", en: "to bewitch", pron: "ahn-sor-suh-lay" },
      { fr: "étinceler", en: "to sparkle, to glitter", pron: "ay-tan-suh-lay" },
      { fr: "ficeler", en: "to tie", pron: "fee-suh-lay" },
      { fr: "niveler", en: "to level", pron: "nee-vuh-lay" },
      { fr: "rappeler", en: "to remind, to call back", pron: "rah-puh-lay" },
      { fr: "renouveler", en: "to renew", pron: "ruh-noo-vuh-lay" }
    ];

    const sentences = [
      {
        verb: "appeler",
        je: { fr: "J'appelle un ami.", en: "I call a friend." },
        tu: { fr: "Tu appelles le médecin.", en: "You call the doctor." },
        singular: { fr: "Il appelle un taxi.", en: "He calls a taxi." },
        nous: { fr: "Nous appelons nos parents.", en: "We call our parents." },
        vous: { fr: "Vous appelez le service client.", en: "You call customer service." },
        plural: { fr: "Ils appellent les secours.", en: "They call for help." }
      },
      {
        verb: "épeler",
        je: { fr: "J'épelle mon nom.", en: "I spell my name." },
        tu: { fr: "Tu épelles ce mot ?", en: "Do you spell this word?" },
        singular: { fr: "Il épelle son adresse.", en: "He spells his address." },
        nous: { fr: "Nous épelons le texte.", en: "We spell the text." },
        vous: { fr: "Vous épelez la commande ?", en: "Are you spelling the order?" },
        plural: { fr: "Elles épellent les phrases.", en: "They spell the sentences." }
      },
      {
        verb: "ensorceler",
        je: { fr: "J'ensorcelle le public.", en: "I bewitch the audience." },
        tu: { fr: "Tu ensorcelles ton auditoire.", en: "You bewitch your audience." },
        singular: { fr: "La sorcière ensorcelle le prince.", en: "The witch bewitches the prince." },
        nous: { fr: "Nous ensorcelons par notre musique.", en: "We bewitch with our music." },
        vous: { fr: "Vous ensorcelez avec vos mots.", en: "You bewitch with your words." },
        plural: { fr: "Ils ensorcellent tout le monde.", en: "They bewitch everyone." }
      },
      {
        verb: "étinceler",
        je: { fr: "J'étincelle de joie.", en: "I sparkle with joy." },
        tu: { fr: "Tu étincelles de malice.", en: "You sparkle with mischief." },
        singular: { fr: "Le diamant étincelle.", en: "The diamond sparkles." },
        nous: { fr: "Nous étincelons de bonheur.", en: "We sparkle with happiness." },
        vous: { fr: "Vous étincelez dans cette robe.", en: "You sparkle in that dress." },
        plural: { fr: "Les étoiles étincellent.", en: "The stars are sparkling." }
      },
      {
        verb: "ficeler",
        je: { fr: "Je ficelle le paquet.", en: "I tie the package." },
        tu: { fr: "Tu ficelles le rôti.", en: "You tie the roast." },
        singular: { fr: "On ficelle les cartons.", en: "We tie the boxes." },
        nous: { fr: "Nous ficelons les sacs.", en: "We tie the bags." },
        vous: { fr: "Vous ficellez le cadeau.", en: "You tie the gift." }, // Note: 'ficellez' is acceptable in some modern spellings, but technically 'ficelez'. Kept user input.
        plural: { fr: "Ils ficellent les branches.", en: "They tie the branches." }
      },
      {
        verb: "niveler",
        je: { fr: "Je nivelle le sol.", en: "I level the ground." },
        tu: { fr: "Tu nivelles le terrain.", en: "You level the terrain." },
        singular: { fr: "Il nivelle la pâte.", en: "He levels the dough." },
        nous: { fr: "Nous nivelons les différences.", en: "We level the differences." },
        vous: { fr: "Vous nivelez la surface.", en: "You level the surface." },
        plural: { fr: "Elles nivellent le chemin.", en: "They level the path." }
      },
      {
        verb: "rappeler",
        je: { fr: "Je me rappelle son visage.", en: "I remember his face." },
        tu: { fr: "Tu rappelles ton frère ?", en: "Are you calling your brother back?" },
        singular: { fr: "On me rappelle demain.", en: "They are calling me back tomorrow." },
        nous: { fr: "Nous rappelons les règles.", en: "We remind the rules." },
        vous: { fr: "Vous rappelez un ancien temps.", en: "You recall an old time." },
        plural: { fr: "Ils se rappellent leur jeunesse.", en: "They remember their youth." }
      },
      {
        verb: "renouveler",
        je: { fr: "Je renouvelle mon abonnement.", en: "I renew my subscription." },
        tu: { fr: "Tu renouvelles l'air.", en: "You renew the air." },
        singular: { fr: "Elle renouvelle son contrat.", en: "She renews her contract." },
        nous: { fr: "Nous renouvelons nos stocks.", en: "We renew our stocks." },
        vous: { fr: "Vous renouvelez vos voeux.", en: "You renew your vows." },
        plural: { fr: "Ils renouvellent le matériel.", en: "They renew the equipment." }
      }
    ];

    // 2. LOGIC
    let index = 0;
    let isStudying = false; 

    const wordEl = document.getElementById("word");
    const inputEl = document.getElementById("input");
    const meaningEl = document.getElementById("meaning");
    const meaningBtn = document.getElementById("meaningBtn");
    const tableContainer = document.getElementById("conjugation-container");
    const tableBody = document.getElementById("table-body");
    const nextBtn = document.getElementById("nextBtn");

    // NEW LOGIC: Highlights "ll" specifically
    function highlightStemChange(sentence, verbInfinitive) {
      let words = sentence.split(" ");
      
      // Basic stem check (first 3 chars)
      const stemStart = verbInfinitive.substring(0, 3).toLowerCase();

      const verbIndex = words.findIndex(w => {
        const cleanWord = w.toLowerCase().replace("j'", "").replace("l'", "");
        return cleanWord.startsWith(stemStart);
      });

      if (verbIndex !== -1) {
        let targetWord = words[verbIndex];
        
        // Check if the word contains double 'll'
        if (targetWord.includes("ll")) {
           // Replace 'll' with the styled span
           words[verbIndex] = targetWord.replace("ll", '<span class="accent-change">ll</span>');
        }
      }

      return words.join(" ");
    }

    function speakText(text, lang) {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang;
      window.speechSynthesis.speak(u);
    }

    function showWord() {
      isStudying = false;
      wordEl.textContent = verbs[index].fr;
      meaningEl.textContent = verbs[index].en;
      inputEl.value = "";
      inputEl.disabled = false;
      inputEl.focus();
      inputEl.classList.remove("correct");

      tableContainer.style.display = "none";
      nextBtn.style.display = "none";
    }

    function renderTable() {
      const data = sentences[index];
      const keys = [
        { key: "je", label: "Je/J'" },
        { key: "tu", label: "Tu" },
        { key: "singular", label: "Il/Elle/On" },
        { key: "nous", label: "Nous" },
        { key: "vous", label: "Vous" },
        { key: "plural", label: "Ils/Elles" },
      ];

      let html = "";
      keys.forEach((k, i) => {
        // Apply the double 'll' highlight
        const formattedSentence = highlightStemChange(data[k.key].fr, data.verb);

        html += `
      <tr id="row-${i}" onclick="readRow(${i})">
        <td><strong>${k.label}</strong></td>
        <td>
          ${formattedSentence} <span class="translation">${data[k.key].en}</span>
        </td>
      </tr>
    `;
      });
      tableBody.innerHTML = html;
    }

    function readAllSentences() {
      window.speechSynthesis.cancel(); 

      const data = sentences[index];
      const keys = ["je", "tu", "singular", "nous", "vous", "plural"];

      keys.forEach((key, i) => {
        const text = data[key].fr;
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "fr-FR";
        utterance.rate = 0.9; 

        utterance.onstart = () => {
          document.querySelectorAll("tr").forEach((tr) => tr.classList.remove("active-row"));
          document.getElementById(`row-${i}`).classList.add("active-row");
        };

        utterance.onend = () => {
          document.getElementById(`row-${i}`).classList.remove("active-row");
        };

        window.speechSynthesis.speak(utterance);
      });
    }

    window.readRow = function (rowIndex) {
      window.speechSynthesis.cancel();
      const data = sentences[index];
      const keys = ["je", "tu", "singular", "nous", "vous", "plural"];
      const text = data[keys[rowIndex]].fr;

      document.querySelectorAll("tr").forEach((tr) => tr.classList.remove("active-row"));
      const row = document.getElementById(`row-${rowIndex}`);
      row.classList.add("active-row");

      const u = new SpeechSynthesisUtterance(text);
      u.lang = "fr-FR";
      u.onend = () => row.classList.remove("active-row");
      window.speechSynthesis.speak(u);
    };

    inputEl.addEventListener("input", () => {
      if (isStudying) return; 

      const val = inputEl.value.toLowerCase().trim();
      if (val === verbs[index].fr.toLowerCase()) {
        isStudying = true;
        inputEl.classList.add("correct");
        inputEl.disabled = true; 

        meaningEl.textContent = verbs[index].pron;
        renderTable();
        tableContainer.style.display = "block";
        nextBtn.style.display = "block";
        nextBtn.focus(); 

        setTimeout(() => {
          readAllSentences();
        }, 500);
      }
    });

    meaningBtn.addEventListener("click", () => {
      meaningEl.textContent = verbs[index].pron;
    });

    nextBtn.addEventListener("click", () => {
      window.speechSynthesis.cancel(); 
      index++;
      if (index < verbs.length) {
        showWord();
      } else {
        document.querySelector(".app").innerHTML = `
        <h1>🎉 Félicitations !</h1>
        <h2>You finished the list.</h2>
        <button onclick="location.reload()">Restart</button>
      `;
      }
    });

    showWord();
  </script>
</body>

</html>
