<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>French Conjugation Trainer</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: radial-gradient(circle at top, #1c1c1c, #0f0f0f);
        color: #eee;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-bottom: 50px;
      }

      .app {
        width: 100%;
        max-width: 650px;
        padding: 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }

      /* Header Section */
      .header-section {
        text-align: center;
        margin-bottom: 20px;
        width: 100%;
      }

      h1 {
        font-size: 1.8rem;
        font-weight: 700;
        color: #fff;
        margin: 0 0 5px 0;
      }

      .subtitle {
        font-size: 1rem;
        color: #4da3ff;
        margin: 0 0 15px 0;
        font-weight: 500;
      }

      .guidance-box {
        background: rgba(255, 255, 255, 0.08);
        border-left: 4px solid #ff4d4d; /* Red for irregulars */
        padding: 12px 16px;
        border-radius: 6px;
        text-align: left;
        margin: 0 auto;
        max-width: 95%;
      }

      .guidance-box p {
        margin: 0;
        font-size: 0.95rem;
        line-height: 1.5;
        color: #ddd;
      }

      .guidance-box strong {
        color: #fff;
        font-weight: 600;
      }

      /* Word & Input */
      h2 {
        font-size: 3rem;
        margin: 10px 0;
        letter-spacing: 1px;
        color: #4da3ff;
      }

      input {
        width: 100%;
        font-size: 1.8rem;
        padding: 12px 14px;
        border-radius: 10px;
        border: none;
        outline: none;
        text-align: center;
        background: #222;
        color: #fff;
        border: 2px solid transparent;
        transition: all 0.3s;
      }

      input:focus {
        outline: none;
        border-color: #4da3ff;
        background: #1e1e1e;
      }

      input.correct {
        border-color: #4ade80;
        background: #1a3320;
        color: #4ade80;
      }

      button {
        width: 100%;
        padding: 12px;
        font-size: 1rem;
        border-radius: 10px;
        border: none;
        cursor: pointer;
        font-weight: 600;
        transition:
          transform 0.15s ease,
          opacity 0.15s ease;
      }

      button:active {
        transform: scale(0.98);
        opacity: 0.9;
      }

      #meaningBtn {
        background: #333;
        color: #ccc;
        margin-bottom: 10px;
      }

      #meaningBtn:hover {
        background: #444;
      }

      #nextBtn {
        background: linear-gradient(135deg, #4ade80, #22c55e);
        color: #003311;
        display: none;
        margin-top: 20px;
      }

      #meaning {
        min-height: 1.5em;
        font-size: 1.1rem;
        opacity: 0.85;
        text-align: center;
        font-style: italic;
      }

      /* Table Styles */
      .table-container {
        width: 100%;
        margin-top: 20px;
        display: none;
        animation: fadeIn 0.5s ease;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: #222;
        border-radius: 10px;
        overflow: hidden;
        font-size: 0.95rem;
      }

      th,
      td {
        padding: 12px 15px;
        text-align: left;
        border-bottom: 1px solid #333;
      }

      th {
        background: #2a2a2a;
        color: #aaa;
        font-weight: 600;
        text-transform: uppercase;
        font-size: 0.8rem;
      }

      /* The "Pointer" Effect */
      tr.active-row {
        background-color: #4da3ff33;
        border-left: 4px solid #4da3ff;
      }

      tr.active-row td {
        color: #fff;
      }

      .translation {
        color: #888;
        font-size: 0.85rem;
        display: block;
        margin-top: 4px;
      }

      /* Highlight class */
      .accent-change {
        color: #ffeb3b; /* Bright Yellow */
        font-weight: bold;
        text-shadow: 0 0 5px rgba(255, 235, 59, 0.5);
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 400px) {
        h2 {
          font-size: 2.2rem;
        }
        td,
        th {
          padding: 8px 10px;
        }
      }
    </style>
  </head>

      // 3. LOGIC
      let index = 0;
      let isStudying = false;

      const wordEl = document.getElementById("word");
      const inputEl = document.getElementById("input");
      const meaningEl = document.getElementById("meaning");
      const meaningBtn = document.getElementById("meaningBtn");
      const tableContainer = document.getElementById("conjugation-container");
      const tableBody = document.getElementById("table-body");
      const nextBtn = document.getElementById("nextBtn");

      // IRREGULAR HIGHLIGHT LOGIC
      // We look for common irregular endings to highlight
      function highlightEnding(sentence) {
        let words = sentence.split(" ");
        let verbIndex = 1;
        if (words[0].toLowerCase().includes("'")) verbIndex = 0;

        let targetWord = words[verbIndex];

        if (targetWord) {
          let cleanWord = targetWord.replace(/[.,?!]/g, "");
          let suffix = "";

          // Specific Irregular Endings Priority List
          if (cleanWord.endsWith("ommes"))
            suffix = "ommes"; // sommes
          else if (cleanWord.endsWith("tes"))
            suffix = "tes"; // faites, êtes
          else if (cleanWord.endsWith("ont"))
            suffix = "ont"; // ont, font, vont, sont
          else if (cleanWord.endsWith("vons"))
            suffix = "vons"; // devons, savons
          else if (cleanWord.endsWith("vez"))
            suffix = "vez"; // devez, savez
          else if (cleanWord.endsWith("ons")) suffix = "ons";
          else if (cleanWord.endsWith("ez")) suffix = "ez";
          else if (cleanWord.endsWith("ent")) suffix = "ent";
          else if (cleanWord.endsWith("eut"))
            suffix = "t"; // peut, veut
          else if (cleanWord.endsWith("eux"))
            suffix = "x"; // peux, veux
          else if (cleanWord.endsWith("ais"))
            suffix = "is"; // vais, fais
          else if (cleanWord.endsWith("ois"))
            suffix = "ois"; // dois
          else if (cleanWord.endsWith("ait"))
            suffix = "it"; // fait, sait
          else if (cleanWord.endsWith("s")) suffix = "s";
          else if (cleanWord.endsWith("t")) suffix = "t";
          else if (cleanWord.endsWith("ai"))
            suffix = "ai"; // j'ai
          else if (cleanWord.endsWith("as"))
            suffix = "as"; // tu as
          else if (cleanWord.endsWith("a")) suffix = "a"; // il a

          if (suffix) {
            const stem = cleanWord.substring(
              0,
              cleanWord.length - suffix.length,
            );
            const punctuation = targetWord.substring(cleanWord.length);
            words[verbIndex] =
              `${stem}<span class="accent-change">${suffix}</span>${punctuation}`;
          }
        }

        return words.join(" ");
      }

      function speakText(text, lang) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = lang;
        window.speechSynthesis.speak(u);
      }

      function showWord() {
        isStudying = false;
        wordEl.textContent = verbs[index].fr;
        meaningEl.textContent = verbs[index].en;
        inputEl.value = "";
        inputEl.disabled = false;
        inputEl.focus();
        inputEl.classList.remove("correct");

        tableContainer.style.display = "none";
        nextBtn.style.display = "none";
      }

      function renderTable() {
        const data = sentences[index];
        const keys = [
          { key: "je", label: "Je/J'" },
          { key: "tu", label: "Tu" },
          { key: "singular", label: "Il/Elle/On" },
          { key: "nous", label: "Nous" },
          { key: "vous", label: "Vous" },
          { key: "plural", label: "Ils/Elles" },
        ];

        let html = "";
        keys.forEach((k, i) => {
          // Apply the highlight
          const formattedSentence = highlightEnding(data[k.key].fr);

          html += `
      <tr id="row-${i}" onclick="readRow(${i})">
        <td><strong>${k.label}</strong></td>
        <td>
          ${formattedSentence} <span class="translation">${data[k.key].en}</span>
        </td>
      </tr>
    `;
        });
        tableBody.innerHTML = html;
      }

      function readAllSentences() {
        window.speechSynthesis.cancel();

        const data = sentences[index];
        const keys = ["je", "tu", "singular", "nous", "vous", "plural"];

        keys.forEach((key, i) => {
          const text = data[key].fr;
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = "fr-FR";
          utterance.rate = 0.9;

          utterance.onstart = () => {
            document
              .querySelectorAll("tr")
              .forEach((tr) => tr.classList.remove("active-row"));
            document.getElementById(`row-${i}`).classList.add("active-row");
          };

          utterance.onend = () => {
            document.getElementById(`row-${i}`).classList.remove("active-row");
          };

          window.speechSynthesis.speak(utterance);
        });
      }

      window.readRow = function (rowIndex) {
        window.speechSynthesis.cancel();
        const data = sentences[index];
        const keys = ["je", "tu", "singular", "nous", "vous", "plural"];
        const text = data[keys[rowIndex]].fr;

        document
          .querySelectorAll("tr")
          .forEach((tr) => tr.classList.remove("active-row"));
        const row = document.getElementById(`row-${rowIndex}`);
        row.classList.add("active-row");

        const u = new SpeechSynthesisUtterance(text);
        u.lang = "fr-FR";
        u.onend = () => row.classList.remove("active-row");
        window.speechSynthesis.speak(u);
      };

      inputEl.addEventListener("input", () => {
        if (isStudying) return;

        const val = inputEl.value.toLowerCase().trim();
        if (val === verbs[index].fr.toLowerCase()) {
          isStudying = true;
          inputEl.classList.add("correct");
          inputEl.disabled = true;

          meaningEl.textContent = verbs[index].pron;
          renderTable();
          tableContainer.style.display = "block";
          nextBtn.style.display = "block";
          nextBtn.focus();

          setTimeout(() => {
            readAllSentences();
          }, 500);
        }
      });

      meaningBtn.addEventListener("click", () => {
        meaningEl.textContent = verbs[index].pron;
      });

      nextBtn.addEventListener("click", () => {
        window.speechSynthesis.cancel();
        index++;
        if (index < verbs.length) {
          showWord();
        } else {
          document.querySelector(".app").innerHTML = `
        <h1>🎉 Félicitations !</h1>
        <h2>You finished the list.</h2>
        <button onclick="location.reload()">Restart</button>
      `;
        }
      });

      showWord();
    </script>
