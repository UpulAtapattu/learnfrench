    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family:

          -apple-system,
          sans-serif;
        background: radial-gradient(circle at top, #1c1c1c, #0f0f0f);
        color: #eee;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-bottom: 50px;
      }

      .app {
        width: 100%;
        max-width: 600px; /* Made wider for the table */
        padding: 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }

      h1 {
        font-size: 1.4rem;
        font-weight: 500;
        opacity: 0.85;
        margin: 0;
      }
      h2 {
        font-size: 3rem;
        margin: 10px 0;
        letter-spacing: 1px;
        color: #4da3ff;
      }

      input {
        width: 100%;
        font-size: 1.8rem;
        padding: 12px 14px;
        border-radius: 10px;
        border: none;
        outline: none;
        text-align: center;
        background: #222;
        color: #fff;
        border: 2px solid transparent;
        transition: all 0.3s;
      }

      input:focus {
        outline: none;
        border-color: #4da3ff;
        background: #1e1e1e;
      }
      input.correct {
        border-color: #4ade80;
        background: #1a3320;
        color: #4ade80;
      }

      button {
        width: 100%;
        padding: 12px;
        font-size: 1rem;
        border-radius: 10px;
        border: none;
        cursor: pointer;
        font-weight: 600;
        transition:
          transform 0.15s ease,
          opacity 0.15s ease;
      }

      button:active {
        transform: scale(0.98);
        opacity: 0.9;
      }

      #meaningBtn {
        background: #333;
        color: #ccc;
        margin-bottom: 10px;
      }
      #meaningBtn:hover {
        background: #444;
      }

      #nextBtn {
        background: linear-gradient(135deg, #4ade80, #22c55e);
        color: #003311;
        display: none; /* Hidden initially */
        margin-top: 20px;
      }

      #meaning {
        min-height: 1.5em;
        font-size: 1.1rem;
        opacity: 0.85;
        text-align: center;
        font-style: italic;
      }

      /* Table Styles */
      .table-container {
        width: 100%;
        margin-top: 20px;
        display: none; /* Hidden until correct */
        animation: fadeIn 0.5s ease;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: #222;
        border-radius: 10px;
        overflow: hidden;
        font-size: 0.95rem;
      }

      th,
      td {
        padding: 12px 15px;
        text-align: left;
        border-bottom: 1px solid #333;
      }

      th {
        background: #2a2a2a;
        color: #aaa;
        font-weight: 600;
        text-transform: uppercase;
        font-size: 0.8rem;
      }

      /* The "Pointer" Effect */
      tr.active-row {
        background-color: #4da3ff33; /* Blue highlight */
        border-left: 4px solid #4da3ff;
      }

      tr.active-row td {
        color: #fff;
      }

      .translation {
        color: #888;
        font-size: 0.85rem;
        display: block;
        margin-top: 4px;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Mobile tweak */
      @media (max-width: 400px) {
        h2 {
          font-size: 2.2rem;
        }
        td,
        th {
          padding: 8px 10px;
        }
      }
    </style>

      // 2. LOGIC
      let index = 0;
      let isStudying = false; // State: are we typing or looking at the table?

      const wordEl = document.getElementById("word");
      const inputEl = document.getElementById("input");
      const meaningEl = document.getElementById("meaning");
      const meaningBtn = document.getElementById("meaningBtn");
      const tableContainer = document.getElementById("conjugation-container");
      const tableBody = document.getElementById("table-body");
      const nextBtn = document.getElementById("nextBtn");

      function speakText(text, lang) {
        // Cancel previous speech to avoid overlap
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = lang;
        window.speechSynthesis.speak(u);
      }

      function showWord() {
        isStudying = false;
        // UI Reset
        wordEl.textContent = verbs[index].fr;
        meaningEl.textContent = verbs[index].en;
        inputEl.value = "";
        inputEl.disabled = false;
        inputEl.focus();
        inputEl.classList.remove("correct");

        // Hide Learning UI
        tableContainer.style.display = "none";
        nextBtn.style.display = "none";
      }

      // Generate table rows based on current verb index
      function renderTable() {
        const data = sentences[index];
        // Map pronouns for clean display
        const keys = [
          { key: "je", label: "Je/J'" },
          { key: "tu", label: "Tu" },
          { key: "singular", label: "Il/Elle/On" },
          { key: "nous", label: "Nous" },
          { key: "vous", label: "Vous" },
          { key: "plural", label: "Ils/Elles" },
        ];

        let html = "";
        keys.forEach((k, i) => {
          html += `
        <tr id="row-${i}" onclick="readRow(${i})">
          <td><strong>${k.label}</strong></td>
          <td>
            ${data[k.key].fr}
            <span class="translation">${data[k.key].en}</span>
          </td>
        </tr>
      `;
        });
        tableBody.innerHTML = html;
      }

      // The "Auto Read" function with Pointer Logic
      function readAllSentences() {
        window.speechSynthesis.cancel(); // Stop anything running

        const data = sentences[index];
        const keys = ["je", "tu", "singular", "nous", "vous", "plural"];

        // Create a chain of speech utterances
        keys.forEach((key, i) => {
          const text = data[key].fr;
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = "fr-FR";
          utterance.rate = 0.9; // Slightly slower for clarity

          // Highlighting logic
          utterance.onstart = () => {
            // Remove active class from all
            document
              .querySelectorAll("tr")
              .forEach((tr) => tr.classList.remove("active-row"));
            // Add to current
            document.getElementById(`row-${i}`).classList.add("active-row");
          };

          utterance.onend = () => {
            document.getElementById(`row-${i}`).classList.remove("active-row");
          };

          window.speechSynthesis.speak(utterance);
        });
      }

      // Allow clicking a row to hear it individually
      window.readRow = function (rowIndex) {
        window.speechSynthesis.cancel();
        const data = sentences[index];
        const keys = ["je", "tu", "singular", "nous", "vous", "plural"];
        const text = data[keys[rowIndex]].fr;

        // Visual Highlight
        document
          .querySelectorAll("tr")
          .forEach((tr) => tr.classList.remove("active-row"));
        const row = document.getElementById(`row-${rowIndex}`);
        row.classList.add("active-row");

        const u = new SpeechSynthesisUtterance(text);
        u.lang = "fr-FR";
        u.onend = () => row.classList.remove("active-row");
        window.speechSynthesis.speak(u);
      };

      // Handle Input
      inputEl.addEventListener("input", () => {
        if (isStudying) return; // Prevent input while studying

        const val = inputEl.value.toLowerCase().trim();
        if (val === verbs[index].fr.toLowerCase()) {
          isStudying = true;
          inputEl.classList.add("correct");
          inputEl.disabled = true; // Lock input

          // 1. Show Translation Pronunciation
          meaningEl.textContent = verbs[index].pron;

          // 2. Show Table
          renderTable();
          tableContainer.style.display = "block";
          nextBtn.style.display = "block";
          nextBtn.focus(); // Move focus to next button

          // 3. Start Audio Sequence (Wait 500ms for visual transition)
          setTimeout(() => {
            readAllSentences();
          }, 500);
        }
      });

      // Buttons
      meaningBtn.addEventListener("click", () => {
        meaningEl.textContent = verbs[index].pron;
      });

      nextBtn.addEventListener("click", () => {
        window.speechSynthesis.cancel(); // Stop reading
        index++;
        if (index < verbs.length) {
          showWord();
        } else {
          // End of list
          document.querySelector(".app").innerHTML = `
        <h1>🎉 Félicitations !</h1>
        <h2>You finished the list.</h2>
        <button onclick="location.reload()">Restart</button>
      `;
        }
      });

      // Initialize
      showWord();
    </script>
