    // NEW LOGIC: Highlights the 'iss' string specific to Type 1 IR verbs
    function highlightStemChange(sentence, verbInfinitive) {
      let words = sentence.split(" ");
      
      // Handle reflexives (remove "s'" or "se " to find the stem)
      let cleanInfinitive = verbInfinitive.toLowerCase();
      if (cleanInfinitive.startsWith("s'")) cleanInfinitive = cleanInfinitive.substring(2);
      if (cleanInfinitive.startsWith("se ")) cleanInfinitive = cleanInfinitive.substring(3);

      const stemStart = cleanInfinitive.substring(0, 3);

      const verbIndex = words.findIndex(w => {
        // Remove pronouns (j', m', t', s', l') for cleaner matching
        const cleanWord = w.toLowerCase().replace(/^[jmtsl]'/g, "");
        return cleanWord.startsWith(stemStart);
      });

      if (verbIndex !== -1) {
        let targetWord = words[verbIndex];
        
        // Check for 'iss' (The plural rule)
        if (targetWord.includes("iss")) {
           words[verbIndex] = targetWord.replace("iss", '<span class="accent-change">iss</span>');
        }
      }

      return words.join(" ");
    }

    function speakText(text, lang) {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang;
      window.speechSynthesis.speak(u);
    }

    function showWord() {
      isStudying = false;
      wordEl.textContent = verbs[index].fr;
      meaningEl.textContent = verbs[index].en;
      inputEl.value = "";
      inputEl.disabled = false;
      inputEl.focus();
      inputEl.classList.remove("correct");

      tableContainer.style.display = "none";
      nextBtn.style.display = "none";
    }

    function renderTable() {
      const data = sentences[index];
      const keys = [
        { key: "je", label: "Je/J'" },
        { key: "tu", label: "Tu" },
        { key: "singular", label: "Il/Elle/On" },
        { key: "nous", label: "Nous" },
        { key: "vous", label: "Vous" },
        { key: "plural", label: "Ils/Elles" },
      ];

      let html = "";
      keys.forEach((k, i) => {
        // Apply the highlight
        const formattedSentence = highlightStemChange(data[k.key].fr, data.verb);

        html += `
      <tr id="row-${i}" onclick="readRow(${i})">
        <td><strong>${k.label}</strong></td>
        <td>
          ${formattedSentence} <span class="translation">${data[k.key].en}</span>
        </td>
      </tr>
    `;
      });
      tableBody.innerHTML = html;
    }

    function readAllSentences() {
      window.speechSynthesis.cancel(); 

      const data = sentences[index];
      const keys = ["je", "tu", "singular", "nous", "vous", "plural"];

      keys.forEach((key, i) => {
        const text = data[key].fr;
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "fr-FR";
        utterance.rate = 0.9; 

        utterance.onstart = () => {
          document.querySelectorAll("tr").forEach((tr) => tr.classList.remove("active-row"));
          document.getElementById(`row-${i}`).classList.add("active-row");
        };

        utterance.onend = () => {
          document.getElementById(`row-${i}`).classList.remove("active-row");
        };

        window.speechSynthesis.speak(utterance);
      });
    }

    window.readRow = function (rowIndex) {
      window.speechSynthesis.cancel();
      const data = sentences[index];
      const keys = ["je", "tu", "singular", "nous", "vous", "plural"];
      const text = data[keys[rowIndex]].fr;

      document.querySelectorAll("tr").forEach((tr) => tr.classList.remove("active-row"));
      const row = document.getElementById(`row-${rowIndex}`);
      row.classList.add("active-row");

      const u = new SpeechSynthesisUtterance(text);
      u.lang = "fr-FR";
      u.onend = () => row.classList.remove("active-row");
      window.speechSynthesis.speak(u);
    };

    inputEl.addEventListener("input", () => {
      if (isStudying) return; 

      const val = inputEl.value.toLowerCase().trim();
      if (val === verbs[index].fr.toLowerCase()) {
        isStudying = true;
        inputEl.classList.add("correct");
        inputEl.disabled = true; 

        meaningEl.textContent = verbs[index].pron;
        renderTable();
        tableContainer.style.display = "block";
        nextBtn.style.display = "block";
        nextBtn.focus(); 

        setTimeout(() => {
          readAllSentences();
        }, 500);
      }
    });

    meaningBtn.addEventListener("click", () => {
      meaningEl.textContent = verbs[index].pron;
    });

    nextBtn.addEventListener("click", () => {
      window.speechSynthesis.cancel(); 
      index++;
      if (index < verbs.length) {
        showWord();
      } else {
        document.querySelector(".app").innerHTML = `
        <h1>🎉 Félicitations !</h1>
        <h2>You finished the list.</h2>
        <button onclick="location.reload()">Restart</button>
      `;
      }
    });

    showWord();
  </script>
</body>

</html>
